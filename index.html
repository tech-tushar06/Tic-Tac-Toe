<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Tic Tac Toe</h1>
      <p>Classic two-player game</p>
    </header>

    <main class="page">
      <section class="gameContainer gameShell">
        <div class="boardPanel">
          <div class="container" role="grid" aria-label="Tic Tac Toe board">
            <div class="line"></div>
            <div class="box bt-0 bl-0"><span class="boxtext"></span></div>
            <div class="box bt-0"><span class="boxtext"></span></div>
            <div class="box bt-0 br-0"><span class="boxtext"></span></div>
            <div class="box bl-0"><span class="boxtext"></span></div>
            <div class="box"><span class="boxtext"></span></div>
            <div class="box br-0"><span class="boxtext"></span></div>
            <div class="box bl-0 bb-0"><span class="boxtext"></span></div>
            <div class="box bb-0"><span class="boxtext"></span></div>
            <div class="box bb-0 br-0"><span class="boxtext"></span></div>
          </div>
        </div>

        <aside class="gameInfo">
          <h2>Ready to play?</h2>
          <p class="subtitle">Take turns and get three in a row.</p>
          <div class="statusRow">
            <span class="info">Turn for X</span>
            <button id="reset">Reset Game</button>
          </div>
          <div class="imgbox">
            <img src="excited.gif" alt="Winner celebration" />
          </div>
        </aside>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
